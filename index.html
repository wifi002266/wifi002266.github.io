        header {

            width: 100%;

        }

        .ip-box {

            padding: 20px 50px;
            background-color: #202225;
            text-align: center;
        }

        .main-title-box h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #dcdee1;
            text-transform: lowercase;
        }

            display: flex;
            flex-direction: column;

            align-items: center;

            max-width: 700px;
            margin: 0 auto 40px auto;
        }

        .server-desc h2 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .server-desc p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #b9bbbe;
        }

            padding: 25px;
            width: 100%;

            text-align: left;
        }

            margin-bottom: 15px;

            display: inline-block;

            list-style: none;
        }

            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
        }
