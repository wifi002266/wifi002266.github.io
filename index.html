        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            background: linear-gradient(rgba(47, 49, 54, 0.85), rgba(47, 49, 54, 0.85)), url('https://wifi002266.github.io/spawn1.jpg.png') no-repeat center center fixed;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 40px;
        }

        /* FEJLÉC */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 40px auto;
        }

        .ip-box {
            border: 3px solid #991b1b;
            border-radius: 12px;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            background-color: #202225;
            color: #dcdee1;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 0 15px rgba(153, 27, 27, 0.2);
        }

        .ip-box:hover {
            background-color: #2f3136;
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .ip-box i {
            margin-left: 10px;
            font-size: 16px;
            color: #991b1b;
        }

        .copy-tooltip {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #10b981;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Poppins', sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .copy-tooltip.show {
            opacity: 1;
        }

        .main-title-box {
            border: 3px solid #991b1b;
            border-radius: 20px;
            padding: 15px 40px;
            background-color: #202225;
            text-align: center;
            box-shadow: 0 0 15px rgba(153, 27, 27, 0.2);
        }

        .main-title-box h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #dcdee1;
            text-transform: lowercase;
        }

        .spacer {
            width: 290px;
        }

        /* TARTALOM */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            gap: 35px;
        }

        .server-desc {
            text-align: center;
        }

        .server-desc h2 {
            font-size: 34px;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
