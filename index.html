<!DOCTYPE html>
<html lang="hu">
<head>

    <title>Router SMP - Weboldal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2f3136; /* Discord szürke háttér */
            color: #dcdee1; /* Világos szürke szöveg */
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Felső rész elrendezése */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            width: 100%;
        }

        /* Bal oldali IP doboz vörös kerettel */
        .ip-box {
            border: 2px solid #991b1b;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            color: #dcdee1;
            background-color: rgba(153, 27, 27, 0.1);
        }

        /* Középső főcím vörös kerettel */
        .main-title-box {
            border: 2px solid #991b1b;
            border-radius: 15px;
            padding: 15px 40px;
            text-align: center;
            background-color: rgba(153, 27, 27, 0.05);
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: #dcdee1;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        /* Középső tartalom (amit a terved alapján feltöltöttünk) */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .server-info {
            margin-bottom: 30px;
        }

        .server-info h2 {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .server-info p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
